  <!-- Remote telemetry and safety logger -->
  <script>
    function sendTelemetry(msg) {
      // Local clean mode
    }

    window.addEventListener('unhandledrejection', function(event) {
      console.warn('[Handled Rejection]:', event.reason);
      sendTelemetry('REJECTION: ' + (event.reason ? (event.reason.message || event.reason) : 'unknown'));
      event.preventDefault();
      event.stopPropagation();
    }, true);

    window.addEventListener('error', function(event) {
      if (event.message && (event.message.includes('Permissions') || event.message.includes('fullscreen'))) {
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      sendTelemetry('JS_ERR: ' + (event.message || 'unknown') + ' at ' + (event.lineno || '0'));
    }, true);

    // Global touch diagnostic logger
    window.addEventListener('touchstart', function(e) {
      try {
        const target = e.target ? (e.target.tagName + (e.target.id ? ('#' + e.target.id) : '')) : 'unknown';
        const touch = e.touches[0];
        if (touch) {
          sendTelemetry('TOUCH_' + target + '_' + Math.round(touch.clientX) + 'x' + Math.round(touch.clientY));
        }
      } catch(err) {}
    }, { capture: true, passive: true });

    // Insecure HTTP Cache API Polyfill for Unity WebGL & Addressables on mobile Wi-Fi
    if (typeof window.caches === 'undefined') {
      console.log('[Polyfill] Installing in-memory Cache API polyfill for insecure HTTP context...');
      const memoryCaches = new Map();
      class MemoryCache {
        constructor(name) {
          this.name = name;
          this.entries = new Map();
        }
        async match(request) {
          const key = typeof request === 'string' ? request : (request.url || '');
          const res = this.entries.get(key);
          return res ? res.clone() : undefined;
        }
        async put(request, response) {
          const key = typeof request === 'string' ? request : (request.url || '');
          try {
            this.entries.set(key, response.clone());
          } catch(e) {}
        }
        async delete(request) {
          const key = typeof request === 'string' ? request : (request.url || '');
          return this.entries.delete(key);
        }
        async keys() {
          return Array.from(this.entries.keys()).map(k => new Request(k));
        }
      }

      window.caches = {
        async open(name) {
          if (!memoryCaches.has(name)) {
            memoryCaches.set(name, new MemoryCache(name));
          }
          return memoryCaches.get(name);
        },
        async has(name) {
          return memoryCaches.has(name);
        },
        async delete(name) {
          return memoryCaches.delete(name);
        },
        async keys() {
          return Array.from(memoryCaches.keys());
        }
      };
    }
  </script>

        try { e.stopPropagation(); } catch(err) {}

      const docEl = document.documentElement;

      const btnStartGame = document.getElementById("btn-start-game");
      if (btnStartGame) {
        btnStartGame.innerText = "গেম চালু হচ্ছে...";
        btnStartGame.style.transform = "scale(0.95)";
        btnStartGame.style.background = "#15803d";
      }

      // 2. Instantly fade out and remove loading screen from DOM
      hideLoadingScreen();

      // 3. Unlock WebAudio Context
      try {
        unlockAudioContext();
      } catch(err) {}

      // 4. Safe Fullscreen & Orientation Lock
      try {
        const docEl = document.documentElement;
        const rfs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
        if (rfs) {
          const p = rfs.call(docEl);
          if (p && typeof p.catch === 'function') p.catch(() => {});
        }
      } catch(err) {}
      try {
        if (window.screen && screen.orientation && typeof screen.orientation.lock === 'function') {
          const p2 = screen.orientation.lock("landscape");
          if (p2 && typeof p2.catch === 'function') p2.catch(() => {});
        }
      } catch(err) {}

      // 5. Focus the canvas
      try {
        canvas.focus();
      } catch(err) {}

      // 6. Direct Garage Boot
      window.addEventListener('unityGameplayStart', () => {
        sendTelemetry('Scene_Ready_Driving');
        hideLoadingScreen();
      }, { once: true });
    }

    // Attach all possible touch & click events to start button
    const btnStart = document.getElementById("btn-start-game");
    ['pointerdown', 'touchstart', 'click'].forEach(evt => {
      if (btnStart) {
        btnStart.addEventListener(evt, (e) => {
          hideLoadingScreen();
          triggerStartGame(e);
        }, { passive: true });
      }
    });

    window.addEventListener('unityGameplayStart', () => {
      sendTelemetry('Scene_Ready_Driving');
      hideLoadingScreen();
    });

    // Initial page load telemetry
    sendTelemetry('Page_Loaded_' + window.innerWidth + 'x' + window.innerHeight + '_Orient_' + (screen.orientation ? screen.orientation.type : 'unknown'));

    /* =========================================================
       3. TOUCH CONTROLS & AUTO-GAS ENGINE
       ========================================================= */
    function toggleTouchControls() {
      const mc = document.getElementById("mobile-controls");
      const btn = document.getElementById("btn-toggle-touch");
      if (!mc) return;
      if (mc.style.display === "none") {
        mc.style.display = "block";
        if (btn) btn.innerText = "📱 কন্ট্রোল: চালু";
      } else {
        mc.style.display = "none";
        if (btn) btn.innerText = "📱 কন্ট্রোল: বন্ধ";
      }
    }

    let autoGasActive = false;
    let autoGasInterval = null;
    function toggleAutoGas() {
      const btn = document.getElementById("btn-auto-gas");
      autoGasActive = !autoGasActive;
      if (autoGasActive) {
        if (btn) {
          btn.innerText = "⚡ গতি চালু ✓";
          btn.style.background = "rgba(34,197,94,0.85)";
        }
        autoGasInterval = setInterval(() => {
          [['ArrowUp', 'ArrowUp', 38], ['w', 'KeyW', 87]].forEach(([key, code, keyCode]) => {
            const ev = new KeyboardEvent('keydown', { key, code, keyCode, which: keyCode, bubbles: true, cancelable: true });
            window.dispatchEvent(ev);
            document.dispatchEvent(ev);
            if (canvas) canvas.dispatchEvent(ev);
          });
        }, 80);
      } else {
        if (btn) {
          btn.innerText = "⚡ অটো-গতি";
          btn.style.background = "rgba(34,197,94,0.3)";
        }
        if (autoGasInterval) clearInterval(autoGasInterval);
        [['ArrowUp', 'ArrowUp', 38], ['w', 'KeyW', 87]].forEach(([key, code, keyCode]) => {
          const ev = new KeyboardEvent('keyup', { key, code, keyCode, which: keyCode, bubbles: true, cancelable: true });
          window.dispatchEvent(ev);
          document.dispatchEvent(ev);
          if (canvas) canvas.dispatchEvent(ev);
        });
      }
    }

    /* Dual-Key Multi-Touch Virtual Controls */
    const activeKeyIntervals = {};

    function bindDualVirtualKey(btnId, arrowData, wasdData) {
      const btn = document.getElementById(btnId);
      if (!btn) return;

      const sendBoth = (type) => {
        [arrowData, wasdData].forEach(([key, code, keyCode]) => {
          const ev = new KeyboardEvent(type, {
            key: key,
            code: code,
            keyCode: keyCode,
            which: keyCode,
            location: 0,
            bubbles: true,
            cancelable: true
          });
          window.dispatchEvent(ev);
          document.dispatchEvent(ev);
          if (canvas) canvas.dispatchEvent(ev);
        });
      };

      const start = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        btn.classList.add("pressed");

        try { unlockAudioContext(); } catch(err) {}

        if (navigator.vibrate) {
          try { navigator.vibrate(15); } catch(err) {}
        }
        sendBoth("keydown");

        if (!activeKeyIntervals[btnId]) {
          activeKeyIntervals[btnId] = setInterval(() => {
            sendBoth("keydown");
          }, 80);
        }
      };

      const end = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        btn.classList.remove("pressed");
        if (activeKeyIntervals[btnId]) {
          clearInterval(activeKeyIntervals[btnId]);
          delete activeKeyIntervals[btnId];
        }
        sendBoth("keyup");
      };

      btn.addEventListener("touchstart", start, { passive: false });
      btn.addEventListener("touchend", end, { passive: false });
      btn.addEventListener("touchcancel", end, { passive: false });
      btn.addEventListener("mousedown", start);
      btn.addEventListener("mouseup", end);
      btn.addEventListener("mouseleave", end);
    }

    // Bind all car controls with BOTH Arrow Keys and WASD Keys
    bindDualVirtualKey("btn-left", ["ArrowLeft", "ArrowLeft", 37], ["a", "KeyA", 65]);
    bindDualVirtualKey("btn-right", ["ArrowRight", "ArrowRight", 39], ["d", "KeyD", 68]);
    bindDualVirtualKey("btn-gas", ["ArrowUp", "ArrowUp", 38], ["w", "KeyW", 87]);
    bindDualVirtualKey("btn-brake", ["ArrowDown", "ArrowDown", 40], ["s", "KeyS", 83]);
    bindDualVirtualKey("btn-nitro", ["f", "KeyF", 70], ["n", "KeyN", 78]);
    bindDualVirtualKey("btn-camera", ["c", "KeyC", 67], ["c", "KeyC", 67]);
    bindDualVirtualKey("btn-horn", ["e", "KeyE", 69], ["h", "KeyH", 72]);

    /* =========================================================
       4. INITIALIZE UNITY ENGINE & AUTO-START
       ========================================================= */
    createUnityInstance(canvas, config, (progress) => {
      const pct = Math.round(progress * 100);
      progressBarFill.style.width = pct + "%";
      statusText.innerText = "গেম রিসোর্স লোড হচ্ছে... " + pct + "%";
    }).then((unityInstance) => {
      window.unityInstance = unityInstance;
      isUnityEngineReady = true;
      console.log("Racing Limits Unity ready!");
      sendTelemetry('Unity_Engine_Ready');

      progressBarFill.style.width = "100%";
      const barBox = document.getElementById("bar-box");
      if (barBox) barBox.style.display = "none";
      statusText.innerHTML = "🏁 প্রস্তুত! সরাসরি গেম শুরু হচ্ছে...";

      // Instantly start the game
      triggerStartGame();

      // Immediately fade out and remove loading overlay from DOM
      hideLoadingScreen();

      // Show audio hint pill if browser blocks initial sound
      if (!audioUnlocked) {
        const aPill = document.getElementById('audio-hint-pill');
        if (aPill) aPill.style.display = 'block';
      }
    }).catch((message) => {
      statusText.innerText = "Error: " + message;
      console.error(message);
      sendTelemetry('Unity_Init_Error: ' + message);
    });
  </script>
</body>
</html>
