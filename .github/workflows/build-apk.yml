name: Build JU 52 Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/ju52-release.jks \
            -alias ju52key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "JU52BatchDay2026!" \
            -keypass "JU52BatchDay2026!" \
            -dname "CN=JU 52 Batch Day, OU=JU52, O=Jahangirnagar University, L=Savar, ST=Dhaka, C=BD"

      - name: Build Signed Release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: /tmp/ju52-release.jks
          ANDROID_KEYSTORE_PASS: "JU52BatchDay2026!"
          ANDROID_KEY_ALIAS: ju52key
          ANDROID_KEY_PASS: "JU52BatchDay2026!"
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK Artifact
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk JU-52.apk
          ls -lh JU-52.apk

      - name: Publish APK to GitHub Release (app-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest JU-52.apk --clobber
          else
            gh release create app-latest JU-52.apk \
              --title "JU 52 Android App" \
              --notes "Official JU 52nd Batch Day Android App (APK)"
          fi
